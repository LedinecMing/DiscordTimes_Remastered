[package]
name = "editor-ui"
version = "0.1.0"
edition = "2021"
description = "Map editor UI shell: eframe window, menu, canvas placeholder, status bar."

[[bin]]
name = "editor"
path = "src/main.rs"

[dependencies]
editor-core = { path = "../editor-core" }
editor-validators = { path = "../editor-validators" }
dt_lib = { path = "../dt_lib" }
eframe = "0.33.3"
rfd = "0.15"
tokio = { version = "1", features = ["rt"] }
