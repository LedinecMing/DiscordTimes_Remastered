[package]
name = "wgpu_ui"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["lib", "cdylib"]

[dependencies]
dt_lib = { path = "../dt_lib/" }
dt_client = { path = "../dt_client" }
ahash = "0.8.11"
tokio = { version = "*", features = ["sync", "rt", "rt-multi-thread", "process", "macros", "fs", "time"] }
futures-util = "*"
tokio-tungstenite = "0.24.0"
tungstenite = "0.24.0"
serde_json = "1.0"
alkahest = { git = "https://github.com/zakarumych/alkahest.git", rev = "99a5b68", features=["derive"] }
dt_server = { path = "../dt_server" }
wgpu = "30"
winit = "0.30"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
fontdue = "0.9"
bytemuck = { version = "1.16", features = ["derive"] }
pollster = "0.4"
discord-rich-presence = "1.1"
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }
# Пин унификации фич ashpd: только tokio-бекенд (rfd xdg-portal везёт zbus default-features=false;
# без явного пина cargo включает zbus/async-io через чужие фичи и ashpd не собирается).
ashpd = { version = "0.11", default-features = false, features = ["tokio"] }
egui = { version = "0.36", default-features = false, features = ["default_fonts"] }
egui-wgpu = { version = "0.36", default-features = false }
# Докинг/тилинг окон редактора (egui_tiles 0.17.1 -> egui 0.36) и графы
# событий (egui-snarl 0.12 -> egui ^0.36); одобрено владельцем 2026-09-14.
egui_tiles = "0.17.1"
egui-snarl = "0.12"
editor-core = { path = "../editor-core" }
editor-validators = { path = "../editor-validators" }

[dev-dependencies]
# Тесты rich_presence: сериализация Activity в JSON без подключения к Discord.
serde_json = "1"

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6", features = ["native-activity"] }

# Android packaging metadata (cargo-apk format, mirrors quad_ui)
[package.metadata.android]
res = "../dt/android_pack/android/res/"
icon = "@mipmap/ic_launcher"
assets = "../dt/android_pack/"
build_targets = [ "aarch64-linux-android", "armv7-linux-androideabi", "i686-linux-android", "x86_64-linux-android" ]
fullscreen = true
label = "Discord Times PVP"

[package.metadata.android.application]
icon = "@mipmap/ic_launcher"
label = "Discord Times PVP"

[package.metadata.android.activity_attributes]
"android:exported" = "true"
"android:screenOrientation" = "userLandscape"

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"
