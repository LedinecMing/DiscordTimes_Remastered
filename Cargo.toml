[workspace]
default-members = ["wgpu_ui"]
members = ["wgpu_ui", "ini_core", "advini", "advini_derive", "math_thingies", "dt_lib", "dt_server", "dtm_info", "dt_client", "dtm_editor", "lit2png", "editor-core", "editor-validators"]
resolver = "2"

#[patch.crates-io] 
#ahash = { "git" = "https://github.com/tkaitchuck/aHash.git", rev = "db36e4c" }

[profile.release]
lto = true
strip = "symbols"
debug = false

# alkahest: debug_assert в write_ref fast-path ложно срабатывает на
# Option::None (size_hint обещает MAX_STACK_SIZE, пишется 1 байт тега) —
# upstream-баг сериализации 99a5b68; опциональные поля (active_unit,
# winner, your_army) встречаются постоянно, поэтому в dev отключаем
# только его debug_assertions (см. /tmp/alkahest_probe, каскадный тест).
[profile.dev.package.alkahest]
debug-assertions = false

[workspace.dependencies]
alkahest = { git = "https://github.com/zakarumych/alkahest.git", rev = "99a5b68", features=["derive"] } 
#[dev-dependencies]
#criterion = { version = "0.5", features = ["html_reports"] }

#[[bench]]
#name = "battles"
#harness = false

[profile.dev]
debug = 2
lto = true

