[workspace]
default-members = ["quad_ui"]
members = ["quad_ui" ,"ini_core", "advini", "advini_derive", "math_thingies", "notan_ui", "ui", "dt_lib", "dt_launcher", "dt_server", "dtm_info", "dt_client", "macroquad"]
resolver = "2"

[patch.crates-io] 
ahash = { "git" = "https://github.com/tkaitchuck/aHash.git", rev = "db36e4c" }

[profile.release]
lto = true
strip = "symbols"
debug = false
panic = "abort"
opt-level = "z"
codegen-units = 1

#[dev-dependencies]
#criterion = { version = "0.5", features = ["html_reports"] }

#[[bench]]
#me = "battles"
#harness = false

[profile.dev]
debug = 2
lto = true
