message="*Сэр не убивайте меня, я грабил не от хорошей жизни, не так давно я был лучшим магом в Мариинской империи, но внезапно император заболел страшным заболеванием, которое скосило четверть населения, вскоре он умер. На престол вступила принцесса Мэри, сначала всё шло хорошо, но постепенно она начала обвинять в заболевании народ рунийцев живших в нашей империи, я был против этих притеснений, но она меня не слушала, постепенно ситуация накалялась, и я попытался свергнуть её, но мои войска были побеждены, а я изгнан."

[Event Рассказ мага-разбойника #2]
name="Рассказ мага-разбойника #2"
sub=true
sub_event=43,
message="*Оставшись с одним артефактом своей страны, я начал путешествовать, изучая новые виды магии. Вскоре я прибыл в северо-западные провинции Эрцгесса, у меня появился замок и скромные владения, но, в один день ко мне попал череп силы, тогда я не знал, для чего он был нужен и приказал отнести на склад. Вскоре пришла армия короля, командир забрал у меня тот череп и его армия сожгла мой замок, деревни, а я чудом уцелел. Теперь же я понял для чего Луиджи тот череп, он собирает могущественные артефакты, чтобы увеличить свои силы и вызвать некий ритуал, в котором он сможет обрести могущество и власть над всем живым."

