message=""Проиграв битву со злым колдуном Виктором фон Ивелвуд, я был повержен и обращен им в тень. Насмехаясь надо мной, он лишил меня сил, и приковал к этому месту, сказав, что я могу спасти свою душу, когда вернусь назад в свой замок. Но у меня нет сил, что бы покинуть это место. Если вам придется сражаться с порождениями мрака, будьте внимательны - иногда после них остаются "Проклятые кости". Если вы принесете мне их, то я обрету силы и смогу вернуться в свой замок, и проклятие спадет!""

