[package] 
name = "dt_lib" 
version = "0.1.0" 
edition = "2024" 
description = "A library of discord times components."

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.10.1"
[dev-dependencies]
tokio = { version = "1.44.2", features = ["macros", "rt"] }
[dependencies] 
dyn-clone = "1.0.6" 
derive_more = {version="0.99.16"} 
rand = "^0.8.0"
getrandom = { version = "0.2", features=["js"] }
math_thingies = {path = "../math_thingies"} 
num = "0.4.0"
sysinfo = "0.33.1"
once_cell = "1.15.0" 
tracing-mutex = "0.2.1" 
ini_core = { path = "../ini_core" } 
pathfinding = "4.3.1" 
advini = { path = "../advini" } 
renet = "0.0.14" 
enum_dispatch = "0.3.12" 
serde = { version = "1.0", features = ["derive"] }
log = "0.4.22"
bzip2 = "0.4.4"
encoding_rs = "0.8.34"
bytes = "1.7.2"
zerocopy = { version="0.8.2", features=["derive"] }
num_enum = "0.7.3"
thiserror = "2.0.9"
itertools = "0.14.0"
indexmap = { version = "2.13.1", features = ["serde"] }
nom = "8.0.0"
alkahest = { workspace=true }
json5 = { version = "1.3.1" }
serde_with = "3.20.0"
serde_json = { version = "1.0.149", features = ["indexmap"] }
schemars = { version="1.2.1", features = ["indexmap2"] }
