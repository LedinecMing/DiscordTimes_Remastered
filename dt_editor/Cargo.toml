[package]
name = "dt_editor"
version = "0.1.0"
edition = "2021"
[dependencies]
egui = { version = "0.31.0" }
slab = { version = "0.4" }
serde = { version = "1.0", features = ["derive"]}
egui-probe = { version = "0.8.0", features = ["derive"]}
eframe = { version = "0.31.0", features = ["serde", "persistence"] }
egui_extras = { version = "0.31.0", features = ["all_loaders"] }
syn = { version = "2.0", features = ["extra-traits"] }
serde_json = { version = "1.0" }
egui-snarl = { git = "https://github.com/zakarumych/egui-snarl", features = ["egui-probe", "serde"] }
dt_lib = { path = "../dt_lib"}
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
